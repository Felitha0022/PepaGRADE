{% extends "base.html" %}

{% block content %}

<h1>Upload Assignment Submission</h1>

<p>
    <strong>Student:</strong>
    {{ assignment.student.full_name }}
</p>

<p>
    <strong>Assignment:</strong>
    {{ assignment.title }}
</p>

<hr>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Upload Submission
    </button>

    <a href="{% url 'assignment_detail' assignment.id %}">
        Cancel
    </a>

</form>

{% endblock %}
