{% extends 'base.html' %}

{% block title %}
Upload Marking Guide
{% endblock %}

{% block content %}

<h2>Upload Marking Guide</h2>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Upload Marking Guide
    </button>

</form>

{% endblock %}
